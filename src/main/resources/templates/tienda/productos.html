<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tienda - Petnimals</title>
    <link rel="stylesheet" th:href="@{/CSS/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/CSS/styles.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
   
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container my-5">
        <div class="row">
            
            <div class="col-lg-3 filter-sidebar d-none d-lg-block">
                <h5 class="filter-title">Categorías</h5>
                <div class="list-group list-group-flush mb-4">
                    <a href="#" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                        Comida para perros <i class="bi bi-chevron-right text-muted small"></i>
                    </a>
                    <a href="#" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                        Comida para gatos <i class="bi bi-chevron-right text-muted small"></i>
                    </a>
                    <a href="#" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                        Salud e Higiene <i class="bi bi-chevron-right text-muted small"></i>
                    </a>
                    <a href="#" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                        Accesorios <i class="bi bi-chevron-right text-muted small"></i>
                    </a>
                </div>

                <h5 class="filter-title">Filtros</h5>
                <div class="mb-3">
                    <label class="form-label fw-bold text-muted">Rango de Precio</label>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="p1">
                        <label class="form-check-label" for="p1">S/. 0 a S/. 50</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="p2">
                        <label class="form-check-label" for="p2">S/. 50 a S/. 150</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="p3">
                        <label class="form-check-label" for="p3">S/. 150 a más</label>
                    </div>
                </div>
            </div>

            <div class="col-lg-9">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="fw-bold m-0" style="color: var(--petnimals-dark);">Nuestros Productos</h3>
                    <span class="text-muted" th:text="${productos.size() + ' artículos encontrados'}">0 artículos encontrados</span>
                </div>

                <div class="row row-cols-1 row-cols-md-3 g-4">
                    <div class="col" th:each="prod : ${productos}">
                        <div class="card h-100 product-card p-3">
                            
                            <div class="text-center mb-3" style="height: 180px; display: flex; align-items: center; justify-content: center;">
                                <img th:src="${prod.imagenUrl != null ? prod.imagenUrl : '/IMG/logo.png'}" 
                                     class="img-fluid" style="max-height: 100%; object-fit: contain;" alt="Imagen de producto">
                            </div>
                            
                            <div class="card-body p-0 d-flex flex-column">
                                <div class="mb-1">
                                    <span >GENERAL</span>
                                </div>
                                <h6 class="card-title fw-bold text-dark text-uppercase mb-1" th:text="${prod.nombre}">Nombre del Producto</h6>
                                <p class="card-text text-muted small flex-grow-1 text-truncate" th:text="${prod.descripcion}">Descripción breve del artículo.</p>
                                
                                <div class="mt-2 mb-3">
                                    <span class="product-price" th:text="'S/ ' + ${#numbers.formatDecimal(prod.precio, 1, 2)}">S/ 0.00</span>
                                    <span class="text-muted small block d-block" th:text="'Stock: ' + ${prod.stock}">Stock: 0</span>
                                </div>
                                
                                <button class="btn btn-orange w-100 py-2">
                                    <i class="bi bi-cart-plus me-2"></i>AGREGAR
                                </button>
                            </div>

                        </div>
                    </div>
                </div>

                <div class="alert alert-info text-center mt-4" th:if="${#lists.isEmpty(productos)}">
                    <i class="bi bi-info-circle me-2"></i>Aún no hay productos registrados en la tienda.
                </div>

            </div>

        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script th:src="@{/JS/bootstrap.min.js}"></script>
</body>
</html>
