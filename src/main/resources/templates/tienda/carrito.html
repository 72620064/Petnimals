<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tu Carrito | Petnimals</title>
    <link rel="stylesheet" th:href="@{/CSS/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .product-img { width: 70px; height: 70px; object-fit: cover; border-radius: 10px; }
        .card-shadow { box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.05); border-radius: 15px; border: none; }
        .btn-orange { background-color: #fd7e14; color: white; }
        .btn-orange:hover { background-color: #e66800; color: white; }
    </style>
</head>
<body class="bg-light">

    <div class="container py-5">
        <h2 class="fw-bold mb-4"><i class="bi bi-basket3"></i> Tu Carrito de Compras</h2>
        
        <div class="card card-shadow p-4">
            <table class="table align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Producto</th>
                        <th>Nombre</th>
                        <th class="text-end">Precio</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="prod : ${carrito}">
                        <td><img th:src="${prod.imagen}" class="product-img shadow-sm"></td>
                        <td class="fw-semibold" th:text="${prod.nombre}"></td>
                        <td class="text-end text-primary fw-bold" th:text="'S/ ' + ${#numbers.formatDecimal(prod.precio, 1, 2)}"></td>
                    </tr>
                </tbody>
            </table>
            
            <div class="d-flex justify-content-end mt-4">
                <button class="btn btn-orange btn-lg px-5" data-bs-toggle="modal" data-bs-target="#modalResumen">
                    <i class="bi bi-credit-card-2-front"></i> Proceder al pago
                </button>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalResumen" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow-lg border-0">
                <div class="modal-header bg-light">
                    <h5 class="modal-title fw-bold">Resumen del Pedido</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center py-4">
                    <p class="text-muted">El total a pagar es:</p>
                    <h2 class="text-orange fw-bold" th:text="'S/ ' + ${#numbers.formatDecimal(total, 1, 2)}">S/ 0.00</h2>
                </div>
                <div class="modal-footer justify-content-center">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <a th:href="@{/finalizar_compra}" class="btn btn-orange px-4">Confirmar Pedido</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/JS/bootstrap.min.js}"></script>

</body>
</html>
