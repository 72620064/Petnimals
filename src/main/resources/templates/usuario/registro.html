<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>PetConnect - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/CSS/styles.css}" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body p-5">
                    <h2 class="text-center mb-4">Crear Cuenta</h2>

                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <form th:action="@{/registro}" th:object="${usuario}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Nombre Completo</label>
                            <input type="text" th:field="*{nombre}" class="form-control" required placeholder="Ej: Juan Pérez">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Correo Electrónico</label>
                            <input type="email" th:field="*{correo}" class="form-control" required placeholder="juan@correo.com">
                            <div class="form-text">Regra RN-01: No se permiten correos duplicados.</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Contraseña</label>
                            <input type="password" th:field="*{contrasenia}" class="form-control" required placeholder="********">
                            <div class="form-text">Regra RN-02: Mínimo 8 caracteres, una mayúscula y un número.</div>
                        </div>

                        <button type="submit" class="btn w-100 mt-3 registrarse">Registrarse</button>
                    </form>

                    <hr class="my-4">
                    <p class="text-center mb-0">¿Ya tienes cuenta? <a th:href="@{/login}" class="iniciar">Inicia sesión aquí</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
