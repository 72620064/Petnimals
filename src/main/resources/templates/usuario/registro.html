<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Petnimals - Registro de Usuario</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4">Crear Cuenta en Petnimals</h3>
                    
                    <form th:action="@{/registro}" th:object="${usuario}" method="post">
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="nombres" class="form-label">Nombres</label>
                                <input type="text" th:field="*{nombres}" id="nombres" class="form-control" placeholder="Ej. Juan" required />
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="apellidos" class="form-label">Apellidos</label>
                                <input type="text" th:field="*{apellidos}" id="apellidos" class="form-control" placeholder="Ej. Pérez" required />
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="correo" class="form-label">Correo Electrónico</label>
                            <input type="email" th:field="*{correo}" id="correo" class="form-control" placeholder="juan.perez@correo.com" required />
                        </div>

                        <div class="mb-3">
                            <label for="telefono" class="form-label">Teléfono / Celular</label>
                            <input type="tel" th:field="*{telefono}" id="telefono" class="form-control" placeholder="Ej. 987654321" required />
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" th:field="*{password}" id="password" class="form-control" placeholder="Min. 8 caracteres, 1 mayúscula y 1 número" required />
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2">Registrarse</button>
                    </form>
                    
                    <div class="text-center mt-3">
                        <p class="small text-muted">¿Ya tienes una cuenta? <a th:href="@{/login}">Inicia sesión aquí</a></p>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
