<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Publicar adopción</title>

    <link rel="stylesheet" th:href="@{/CSS/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/CSS/styles.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container my-5">

    <div class="hero-section p-4 mb-4">
        <h2 class="fw-bold">Publicar animal en adopción</h2>
        <p class="text-muted">Completa los datos para ayudarlo a encontrar hogar 🐾</p>
    </div>

    <div class="card shadow-sm border-0 p-4">

        <form th:action="@{/adopciones/guardar}" method="post">

            <!-- 🔐 CSRF (OBLIGATORIO EN SPRING SECURITY) -->
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control" name="nombre" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Edad</label>
                <input type="text" class="form-control" name="edad">
            </div>

            <div class="mb-3">
                <label class="form-label">Raza</label>
                <input type="text" class="form-control" name="raza">
            </div>

            <div class="mb-3">
                <label class="form-label">Descripción</label>
                <textarea class="form-control" name="descripcion"></textarea>
            </div>

            <!-- IMAGEN -->
            <div class="mb-3">
                <label class="form-label fw-bold">URL de la Imagen</label>
                <input type="text"
                       class="form-control"
                       name="imagen"
                       placeholder="https://...">
            </div>

            <button type="submit" class="btn btn-orange w-100">
                Publicar
            </button>

        </form>

    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/JS/bootstrap.min.js}"></script>

</body>
</html>
